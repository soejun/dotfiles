# Keybinds — Super modifier, vim hjkl, mirroring the Sway box where Hyprland
# allows. Full Sway→Hyprland parity table in docs/hyprland-desktop-plan.md.
# https://wiki.hypr.land/Configuring/Binds/

$mod = SUPER
$term = kitty
$menu = wofi --show drun
$fileManager = dolphin

# --- Apps & session ---
bind = $mod, RETURN, exec, $term
bind = $mod, Q, killactive,
bind = $mod, E, exec, $fileManager
bind = $mod, SPACE, exec, $menu
bind = $mod SHIFT, C, exec, hyprctl reload
bind = $mod SHIFT, E, exec, wlogout
bind = $mod, ESCAPE, exec, hyprlock

# --- Focus (vim hjkl) ---
bind = $mod, h, movefocus, l
bind = $mod, j, movefocus, d
bind = $mod, k, movefocus, u
bind = $mod, l, movefocus, r

# --- Move window (vim hjkl) ---
bind = $mod SHIFT, h, movewindow, l
bind = $mod SHIFT, j, movewindow, d
bind = $mod SHIFT, k, movewindow, u
bind = $mod SHIFT, l, movewindow, r

# --- Layout ---
bind = $mod, F, fullscreen,
bind = $mod, V, togglefloating,
bind = $mod SHIFT, SPACE, togglefloating,
bind = $mod, T, layoutmsg, togglesplit
bind = $mod, P, pseudo,
# Groups are Hyprland's analog to Sway's tabbed layout.
bind = $mod, W, togglegroup,
bind = $mod, TAB, changegroupactive, f
bind = $mod SHIFT, TAB, changegroupactive, b

# --- Workspaces ---
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# --- Scratchpad (special workspace), parity with Sway's $mod+minus ---
bind = $mod, minus, togglespecialworkspace, magic
bind = $mod SHIFT, minus, movetoworkspace, special:magic

# --- Resize submap (parity with Sway's $mod+r resize mode) ---
bind = $mod, R, submap, resize
submap = resize
binde = , h, resizeactive, -50 0
binde = , j, resizeactive, 0 50
binde = , k, resizeactive, 0 -50
binde = , l, resizeactive, 50 0
bind = , escape, submap, reset
bind = , return, submap, reset
submap = reset
# Direct resize without entering the submap.
bind = $mod CTRL, h, resizeactive, -50 0
bind = $mod CTRL, j, resizeactive, 0 50
bind = $mod CTRL, k, resizeactive, 0 -50
bind = $mod CTRL, l, resizeactive, 50 0

# --- Mouse drag move/resize ---
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# --- Screenshots (hyprshot), parity with Sway's grimshot keys ---
bind = $mod SHIFT, A, exec, hyprshot -m region
bind = $mod SHIFT, S, exec, hyprshot -m window
bind = $mod SHIFT, W, exec, hyprshot -m output
bind = $mod SHIFT, P, exec, hyprpicker -a

# --- Clipboard history (cliphist + wofi) ---
bind = $mod SHIFT, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# --- Notifications (swaync) ---
bind = $mod SHIFT, N, exec, swaync-client -t -sw

# --- Volume & brightness via swayosd (on-screen popups) ---
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindl  = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindl  = , XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower

# --- Media transport (playerctl) ---
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
