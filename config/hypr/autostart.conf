# Autostart — daemons and comfort tools launched with the session.
# https://wiki.hypr.land/Configuring/Keywords/#executing

# Wallpaper
exec-once = hyprpaper

# Status bar + notification daemon
exec-once = waybar
exec-once = swaync

# GUI auth prompts (polkit)
# Auto-lock/idle (hypridle) intentionally disabled — lock manually with Super+Esc.
# Re-enable by uncommenting; tune timeouts in hypridle.conf.
# exec-once = hypridle
exec-once = systemctl --user start hyprpolkitagent

# On-screen volume/brightness popups (server for swayosd-client binds)
exec-once = swayosd-server

# Clipboard history — watch text and images
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Removable-drive automount (tray icon)
exec-once = udiskie --tray

# Network + Bluetooth tray applets
exec-once = nm-applet --indicator
exec-once = blueman-applet

# GTK theming parity with the Sway box
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'Adwaita-dark'
exec-once = gsettings set org.gnome.desktop.interface icon-theme 'Adwaita'
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
