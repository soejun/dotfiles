# hyprlock — lock screen, Tokyo Night Storm.
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

general {
    hide_cursor = true
    grace = 0
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/Pictures/wave2.png
    blur_passes = 3
    blur_size = 7
    color = rgba(1f2335ff)
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(7aa2f7ee)
    inner_color = rgba(24283bee)
    font_color = rgba(c0caf5ff)
    check_color = rgba(9ece6aee)
    fail_color = rgba(f7768eee)
    fade_on_empty = false
    placeholder_text = <i>password…</i>
    position = 0, -20
    halign = center
    valign = center
}

# Clock
label {
    monitor =
    text = $TIME
    color = rgba(c0caf5ff)
    font_size = 64
    font_family = FantasqueSansM Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(a9b1d6ff)
    font_size = 22
    font_family = FantasqueSansM Nerd Font
    position = 0, 50
    halign = center
    valign = center
}
