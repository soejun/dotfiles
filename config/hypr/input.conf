# Input — keyboard, pointer, touchpad. Mirrors the Sway box's behavior:
# Caps acts as Ctrl, tap-to-click, natural scrolling.
# https://wiki.hypr.land/Configuring/Variables/#input

input {
    kb_layout = us
    kb_options = ctrl:nocaps

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}

# 3-finger horizontal swipe switches workspaces.
gesture = 3, horizontal, workspace
