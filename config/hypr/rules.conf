# Window rules — Hyprland 0.54 block syntax.
# https://wiki.hypr.land/Configuring/Window-Rules/

# Apps misbehave less when maximize requests are ignored.
windowrule {
    name = suppress-maximize
    match:class = .*

    suppress_event = maximize
}

# Common utility/dialog windows should float.
windowrule {
    name = float-utilities
    match:class = ^(pavucontrol|org.pulseaudio.pavucontrol|blueman-manager|nm-connection-editor|org.kde.polkit-kde-authentication-agent-1)$

    float = yes
}

# Picture-in-Picture floats and stays pinned across workspaces.
windowrule {
    name = pip-floating
    match:title = ^(Picture-in-Picture)$

    float = yes
    pin = yes
}
