# MACHINE-LOCAL — edit this file per host. It is the one piece of the Hyprland
# config that differs between machines. List outputs with:
#   hyprctl monitors all
#
# This host (CachyOS laptop): single internal panel.
monitor = eDP-1, 1920x1080@60, 0x0, 1

# Auto-configure any other/unspecified output at its preferred mode.
monitor = , preferred, auto, 1

# Reference — the Debian/Sway box runs dual 4K with one panel rotated:
# monitor = DP-1, 3840x2160, 0x0, 1
# monitor = HDMI-A-1, 3840x2160, 3840x0, 1, transform, 1
