# Environment variables — cursor size, toolkit theming, Wayland hints.
# https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# GTK apps follow a dark theme (parity with the Sway box's gsettings).
# Reinforced via gsettings in autostart.conf.
env = GTK_THEME,Adwaita-dark

# Qt/KDE apps (e.g. dolphin) theme via the KDE platform theme (plasma-integration),
# which reads the Tokyo Night Storm palette from ~/.config/kdeglobals.
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,kde
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1

# Prefer the Wayland backend in Firefox.
env = MOZ_ENABLE_WAYLAND,1
